apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v261105-60b7f2ed.provideraccessrequests.providers.platform-mesh.io
spec:
  group: providers.platform-mesh.io
  names:
    kind: ProviderAccessRequest
    listKind: ProviderAccessRequestList
    plural: provideraccessrequests
    singular: provideraccessrequest
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.providerRef.name
      name: Provider
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      description: |-
        ProviderAccessRequest is a one-shot auth-material delivery object. An
        Owner creates it to drive the user-side access SDK to mint a kubeconfig
        for a Provider Workspace on this PM.

        Reconciliation rules:
          - Order-independent: if the referenced Provider doesn't exist yet, the
            request sits in Pending until it does. If the Provider exists but
            lacks spec.remote, the request goes Failed with
            ProviderNotRemoteMode.
          - One active request per Provider: new requests arriving while an
            older non-terminal request exists for the same Provider go Failed
            immediately with AnotherPARActive. Oldest wins.
          - Terminal states (Completed, Failed) are not auto-touched.
          - Deleting the referenced Provider cascades to all its
            ProviderAccessRequests.
      properties:
        apiVersion:
          description: |-
            APIVersion defines the versioned schema of this representation of an object.
            Servers should convert recognized schemas to the latest internal value, and
            may reject unrecognized values.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
          type: string
        kind:
          description: |-
            Kind is a string value representing the REST resource this object represents.
            Servers may infer this from the endpoint the client submits requests to.
            Cannot be updated.
            In CamelCase.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
          type: string
        metadata:
          type: object
        spec:
          description: spec defines the desired state of ProviderAccessRequest.
          properties:
            accessTokenSecretRef:
              description: |-
                accessTokenSecretRef references a Secret containing the pma1 access
                token obtained from the user-side cluster. The access SDK's /access
                URL and the HMAC credential for the initial handshake are derived
                from the token's wire form.
              properties:
                key:
                  default: accessToken
                  description: |-
                    key is the key within the Secret data holding the access token.
                    Defaults to "accessToken".
                  type: string
                name:
                  description: name is the name of the Secret.
                  type: string
                namespace:
                  description: namespace is the namespace of the Secret.
                  type: string
              required:
              - name
              - namespace
              type: object
            providerRef:
              description: |-
                providerRef references the Provider this request is binding to by
                name. The Provider must exist with spec.remote set; if not, the
                request waits (Provider missing) or fails (Provider not in remote
                mode).
              properties:
                name:
                  default: ""
                  description: |-
                    Name of the referent.
                    This field is effectively required, but due to backwards compatibility is
                    allowed to be empty. Instances of this type with an empty value here are
                    almost certainly wrong.
                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                  type: string
              type: object
              x-kubernetes-map-type: atomic
          required:
          - accessTokenSecretRef
          - providerRef
          type: object
        status:
          description: status defines the observed state of ProviderAccessRequest.
          properties:
            conditions:
              description: conditions represent the current state of the ProviderAccessRequest.
              items:
                description: Condition contains details for one aspect of the current
                  state of this API Resource.
                properties:
                  lastTransitionTime:
                    description: |-
                      lastTransitionTime is the last time the condition transitioned from one status to another.
                      This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                    format: date-time
                    type: string
                  message:
                    description: |-
                      message is a human readable message indicating details about the transition.
                      This may be an empty string.
                    maxLength: 32768
                    type: string
                  observedGeneration:
                    description: |-
                      observedGeneration represents the .metadata.generation that the condition was set based upon.
                      For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                      with respect to the current state of the instance.
                    format: int64
                    minimum: 0
                    type: integer
                  reason:
                    description: |-
                      reason contains a programmatic identifier indicating the reason for the condition's last transition.
                      Producers of specific condition types may define expected values and meanings for this field,
                      and whether the values are considered a guaranteed API.
                      The value should be a CamelCase string.
                      This field may not be empty.
                    maxLength: 1024
                    minLength: 1
                    pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                    type: string
                  status:
                    description: status of the condition, one of True, False, Unknown.
                    enum:
                    - "True"
                    - "False"
                    - Unknown
                    type: string
                  type:
                    description: type of condition in CamelCase or in foo.example.com/CamelCase.
                    maxLength: 316
                    pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                    type: string
                required:
                - lastTransitionTime
                - message
                - reason
                - status
                - type
                type: object
              type: array
              x-kubernetes-list-map-keys:
              - type
              x-kubernetes-list-type: map
            observedGeneration:
              description: |-
                observedGeneration is the last generation reconciled by the
                controller.
              format: int64
              type: integer
            phase:
              description: 'phase summarises reconciliation state: Pending, Completed,
                or Failed.'
              type: string
          type: object
      required:
      - spec
      type: object
    served: true
    storage: true
    subresources:
      status: {}
