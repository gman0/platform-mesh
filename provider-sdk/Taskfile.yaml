version: "3"

includes:
  # Shared go-installable tooling (controller-gen, golangci-lint, mockery,
  # apigen), installed once into the root bin/ and reused by every component.
  tools:
    taskfile: ../tools/Taskfile.yaml
    dir: .

vars:
  CRD_DIRECTORY: config/crd/bases
  # provider-gateway's CRD chart, kept in step with the generated CRDs.
  CRD_CHART_DIRECTORY: ../provider-gateway-crds-chart/crds

tasks:
  build:
    desc: Build the module
    cmds:
      - go build ./...

  docker-build:
    desc: Build the provider-gateway image (IMAGE= to override); the build context is the repository root.
    dir: ..
    vars:
      IMAGE: '{{.IMAGE | default "ghcr.io/platform-mesh/provider-gateway:dev"}}'
    cmds:
      - docker build -f provider-sdk/Dockerfile -t {{.IMAGE}} .

  manifests:
    desc: Generate the CRDs of the SDK's kinds, and copy them into provider-gateway's CRD chart.
    cmds:
      - task: tools:generate-crds
        vars:
          BASEDIR: '{{.TASKFILE_DIR}}'
          PATH: /api/...
          OUTPUT: '{{.CRD_DIRECTORY}}'
      - rm -f {{.CRD_CHART_DIRECTORY}}/*.yaml
      - cp {{.CRD_DIRECTORY}}/*.yaml {{.CRD_CHART_DIRECTORY}}/

  generate:
    desc: Run code generation.
    cmds:
      - task: manifests
      - task: tools:generate-deepcopy
        vars:
          BASEDIR: '{{.TASKFILE_DIR}}'
          PATH: /api/...

  lint:
    desc: Run golangci-lint
    cmds:
      - task: tools:lint

  test:
    desc: Run unit tests
    cmds:
      - go test -count=1 -short ./...

  test-e2e:
    desc: No e2e tests for the provider-sdk module yet.
    cmds:
      - 'echo "provider-sdk: no e2e tests"'

  validate:
    desc: Run lint and tests
    cmds:
      - task: lint
      - task: test
