{{- $tag := default .Chart.AppVersion .Values.image.tag -}}
{{- $imageRef := printf "%s/%s:%s" .Values.image.registry .Values.image.repository $tag -}}
{{- if .Values.image.digest -}}
{{- $imageRef = printf "%s/%s@%s" .Values.image.registry .Values.image.repository .Values.image.digest -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.entity.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      {{- include "common.labelMatcher" . | indent 6 }}
  replicas: {{ .Values.deployment.replicas }}
  template:
    metadata:
      labels:
        {{- include "common.labelMatcher" . | indent 8 }}
        {{- with .Values.deployment.specTemplate.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        control-plane: access-operator
      annotations:
        {{- with .Values.deployment.specTemplate.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "common.entity.name" . }}
      {{- include "common.imagePullSecret" . | indent 6 }}
      automountServiceAccountToken: {{ .Values.security.mountServiceAccountToken }}
      containers:
        - name: manager
          image: {{ $imageRef }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          args:
            - operator
            - --kcp-external-url={{ required "kcp.externalUrl is required" .Values.kcp.externalUrl }}
            - --kcp-ca-bundle-path=/kcp-ca/{{ .Values.kcp.caBundleSecretKey }}
            - --kcp-namespace={{ .Values.kcp.namespace }}
            - --kcp-front-proxy-name={{ .Values.kcp.frontProxyName }}
            - --kcp-front-proxy-port={{ .Values.kcp.frontProxyPort }}
            {{- if .Values.kcp.url }}
            - --kcp-url={{ .Values.kcp.url }}
            {{- end }}
            - --kcp-cluster-admin-secret-name={{ .Values.kcp.clusterAdminSecretName }}
            - --access-apiexport-endpointslice-name={{ .Values.access.endpointSliceName }}
            - --access-apiexport-endpointslice-workspace={{ .Values.access.endpointSliceWorkspace }}
            - --leader-elect={{ .Values.operator.leaderElect }}
          volumeMounts:
            - name: kcp-ca
              mountPath: /kcp-ca
              readOnly: true
      volumes:
        - name: kcp-ca
          secret:
            secretName: {{ .Values.kcp.caBundleSecret }}
