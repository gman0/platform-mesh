apiVersion: apis.kcp.io/v1alpha2
kind: APIExport
metadata:
  name: access.platform-mesh.io
spec:
  resources:
  - group: access.platform-mesh.io
    name: accessgrants
    schema: v261105-72b4f057.accessgrants.access.platform-mesh.io
    storage:
      crd: {}
  # access-operator reads the mirror access-token Secret and manages
  # an SA-token Secret (kubernetes.io/service-account-token shape) in
  # each Provider Workspace that binds this APIExport. Subresource
  # claims — the cleaner path via serviceaccounts/token:create — are
  # not yet supported on tagged kcp releases, so SA-token Secrets are
  # the only workable option today.
  #
  # Must be accepted on each per-workspace APIBinding; see par_grant.go
  # in platform-mesh-operator for the auto-accept path.
  permissionClaims:
    - group: ""
      resource: secrets
      identityHash: ""
      verbs:
        - get
        - create
        - delete
status: {}
