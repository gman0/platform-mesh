{{- if .Values.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "common.entity.name" . }}
  namespace: {{ .Values.httpRoute.namespace | default .Release.Namespace }}
spec:
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  parentRefs:
    {{- range .Values.httpRoute.parentRefs }}
    - group: {{ .group }}
      kind: {{ .kind }}
      name: {{ .name }}
      namespace: {{ .namespace }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httpRoute.pathPrefix | default "/" }}
      {{- with .Values.httpRoute.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "common.entity.name" . }}
          namespace: {{ .Release.Namespace }}
          port: 443
          weight: 1
{{- end }}
