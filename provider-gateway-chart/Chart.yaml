apiVersion: v2
name: provider-gateway
description: provider-gateway lets a service provider offer its APIs on Platform Mesh instances that reach it from outside. Installed by the Provider, in its own cluster.
type: application
version: 0.1.0
appVersion: "v0.0.0"
dependencies:
  - name: common
    version: 0.16.0
    repository: oci://ghcr.io/platform-mesh/helm-charts
  - name: provider-gateway-crds
    version: 0.1.0
    repository: file://../provider-gateway-crds-chart
    condition: crds.enabled
