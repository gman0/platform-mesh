image:
  # -- Image registry.
  registry: ghcr.io
  # -- Image repository (without registry).
  repository: platform-mesh/platform-mesh/platform-mesh-access
  # -- Image digest (when set, overrides tag: registry/repository@digest).
  digest: ""

# -- External HTTPS URL for /access. Encoded into minted access tokens.
# Required; the SDK refuses to run without it.
publicUrl: ""

# -- Port the /access HTTPS listener binds to inside the Pod. Exposed
# externally via the Service below.
accessPort: 8443

tls:
  # -- Name of the cert-manager Certificate / resulting Secret holding
  # the TLS cert+key for /access. Created by the chart below.
  secretName: platform-mesh-access-tls
  # -- DNS names + IPs covered by the TLS cert. At minimum the service
  # DNS name should be here; add external hostnames (if ingress is used)
  # to the list.
  dnsNames:
    - platform-mesh-access.platform-mesh-system.svc
  # -- cert-manager ClusterIssuer used to issue the Certificate. Leave
  # empty to skip Certificate creation (user mounts an externally
  # managed Secret under the configured secretName).
  issuerRef: ""

service:
  # -- Service type exposing /access to access-operator. ClusterIP works
  # for in-cluster deployments; LoadBalancer / NodePort for cross-cluster
  # reachability.
  type: ClusterIP

security:
  mountServiceAccountToken: true

deployment:
  specTemplate:
    annotations: {}
    labels: {}
  replicas: 1

operator:
  leaderElect: true
