---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: accessidentities.access-sdk.platform-mesh.io
spec:
  group: access-sdk.platform-mesh.io
  names:
    kind: AccessIdentity
    listKind: AccessIdentityList
    plural: accessidentities
    singular: accessidentity
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.accept
      name: Accept
      type: string
    - jsonPath: .status.tokenID
      name: TokenID
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AccessIdentity is a standing authorization on the user-side cluster for
          a PM instance to deliver kubeconfigs via /access. On creation, the
          access SDK mints an access token (tokenID + HMAC secret), writes the
          full token into an owned Secret, and starts serving /access calls
          authenticated against that identity's HMAC secret. One AccessIdentity
          maps to many Access objects over time.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of AccessIdentity.
            properties:
              accept:
                default: Always
                description: |-
                  accept controls how incoming /access calls are handled.
                  Defaults to Always.
                enum:
                - Always
                - Manual
                type: string
              maxPending:
                description: maxPending caps the pending queue size while accept is
                  Manual.
                format: int32
                type: integer
              pendingTTL:
                description: |-
                  pendingTTL is how long a pending connection stays in the queue
                  before being dropped. Only meaningful while accept is Manual.
                type: string
            type: object
          status:
            description: status defines the observed state of AccessIdentity.
            properties:
              conditions:
                description: conditions represent the current state of the AccessIdentity.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  observedGeneration is the last generation reconciled by the
                  access SDK.
                format: int64
                type: integer
              pendingConnections:
                description: |-
                  pendingConnections lists /access calls awaiting manual approval.
                  Populated only while spec.accept is Manual.
                items:
                  description: |-
                    PendingConnection is an entry in AccessIdentity.status.pendingConnections
                    surfaced while spec.accept is Manual. Populated by the access SDK;
                    approved/denied by the Provider patching the identity.
                  properties:
                    expiresAt:
                      description: |-
                        expiresAt is when this pending entry will be dropped if not
                        approved. Derived from spec.pendingTTL.
                      format: date-time
                      type: string
                    receivedAt:
                      description: receivedAt is when the access SDK first saw the
                        call.
                      format: date-time
                      type: string
                    tokenID:
                      description: |-
                        tokenID identifies the incoming /access call; matches the tokenID
                        component of the access token.
                      type: string
                  required:
                  - expiresAt
                  - receivedAt
                  - tokenID
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - tokenID
                x-kubernetes-list-type: map
              tokenID:
                description: |-
                  tokenID is the public portion of the access token minted for this
                  identity. The full token lives in an owned Secret.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
