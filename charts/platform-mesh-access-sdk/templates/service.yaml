apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.entity.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "common.labelMatcher" . | indent 4 }}
  ports:
    - name: access
      port: 443
      targetPort: access
      protocol: TCP
      {{- with .Values.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
