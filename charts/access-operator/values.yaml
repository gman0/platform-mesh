image:
  # -- Image registry.
  registry: ghcr.io
  # -- Image repository (without registry).
  repository: platform-mesh/platform-mesh/access-operator
  # -- Image digest (when set, overrides tag: registry/repository@digest).
  digest: ""

# -- Name of the Secret holding the operator's kcp kubeconfig. This
# Secret is not created by this chart; in a regular Platform Mesh
# installation it is provisioned and renewed by platform-mesh-operator's
# ProvidersecretSubroutine (see DefaultProviderConnections, the
# "access-operator-kubeconfig" entry). The Secret carries a scoped
# ServiceAccount token addressing the access.platform-mesh.io
# APIExportEndpointSlice in root:platform-mesh-system.
kubeconfigSecret: access-operator-kubeconfig

kcp:
  # -- Name of the APIExportEndpointSlice the operator engages via its
  # apiexport-provider. Must match the APIExport the kubeconfig above is
  # scoped to.
  apiExportEndpointSliceName: access.platform-mesh.io

  # -- Publicly-reachable kcp URL propagated into the /access handshake
  # body for user-side clusters to use. Required; operator refuses to
  # perform handshakes if unset.
  externalUrl: ""

  # -- Secret mounted into the Pod carrying the kcp CA bundle PEM
  # (propagated into the /access handshake body). Must exist in the
  # Release namespace. Default matches the ServerCA Issuer Secret
  # cert-manager writes for a RootShard named "root" — the same Secret
  # kcp-operator reads when it builds Kubeconfig CR outputs (see
  # kcp-operator's internal/resources/kubeconfig/secret.go). Override
  # if your kcp install uses a different RootShard name or provides
  # the bundle some other way.
  caBundleSecret: root-server-ca
  # -- Key inside kcp.caBundleSecret whose value is the PEM CA bundle.
  # cert-manager stores the Issuer's CA under tls.crt.
  caBundleSecretKey: tls.crt

security:
  mountServiceAccountToken: true

deployment:
  specTemplate:
    annotations: {}
    labels: {}
  replicas: 1

operator:
  leaderElect: true
