{{ $ns := include "provider-gateway.kubeconfigNamespace" . -}}
{{- if eq $ns .Release.Namespace -}}
{{- fail "kubeconfigSecrets.namespace must differ from the release namespace, which holds the Server Keys' private keys" -}}
{{- end -}}
# The kubeconfig Secrets, one per Connection, apart from the keys: whoever reads them
# (the Provider's operator) can't read the Server Keys' or the CAs' Secrets.
{{- if .Values.kubeconfigSecrets.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    {{- include "provider-gateway.labels" . | nindent 4 }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "provider-gateway.name" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "provider-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "provider-gateway.name" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "provider-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "provider-gateway.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "provider-gateway.name" . }}
    namespace: {{ .Release.Namespace }}
{{- with .Values.kubeconfigSecrets.readers }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "provider-gateway.name" $ }}-kubeconfig-reader
  namespace: {{ $ns }}
  labels:
    {{- include "provider-gateway.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "provider-gateway.name" $ }}-kubeconfig-reader
  namespace: {{ $ns }}
  labels:
    {{- include "provider-gateway.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "provider-gateway.name" $ }}-kubeconfig-reader
subjects:
  {{- toYaml . | nindent 2 }}
{{- end }}
