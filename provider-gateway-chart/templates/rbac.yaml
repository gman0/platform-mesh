# provider-gateway's own namespace: the SDK's resources, the Server Keys' Secrets, the
# self-signed CA, its Lease. The kubeconfig Secrets are in their own namespace
# (kubeconfig-secrets.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "provider-gateway.name" . }}
  labels:
    {{- include "provider-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: ["provider-sdk.platform-mesh.io"]
    resources: ["connections", "onboardingtokens", "serverkeys"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["provider-sdk.platform-mesh.io"]
    resources: ["connections/status", "onboardingtokens/status", "serverkeys/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["provider-sdk.platform-mesh.io"]
    resources: ["connections/finalizers", "serverkeys/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "provider-gateway.name" . }}
  labels:
    {{- include "provider-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "provider-gateway.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "provider-gateway.name" . }}
    namespace: {{ .Release.Namespace }}
