{{- if eq .Values.servingTLS.mode "cert-manager" }}
{{- $name := include "provider-gateway.name" . -}}
{{- $issuerRef := .Values.servingTLS.certManager.issuerRef -}}
{{- if not $issuerRef }}
# The operator proxy's CA: long-lived, trusted by the kubeconfigs. Changing it is a
# deliberate operation, not a rotation.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $name }}-selfsigned
  labels:
    {{- include "provider-gateway.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}-ca
  labels:
    {{- include "provider-gateway.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: {{ $name }} CA
  secretName: {{ $name }}-ca
  duration: {{ .Values.servingTLS.certManager.caDuration }}
  revisionHistoryLimit: 10
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: {{ $name }}-selfsigned
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $name }}-ca
  labels:
    {{- include "provider-gateway.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ $name }}-ca
---
{{- end }}
# The serving certificate, renewed by cert-manager; provider-gateway reloads it, and
# takes the kubeconfigs' trust bundle from its ca.crt.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "provider-gateway.servingSecretName" . }}
  labels:
    {{- include "provider-gateway.labels" . | nindent 4 }}
spec:
  secretName: {{ include "provider-gateway.servingSecretName" . }}
  duration: {{ .Values.servingTLS.certManager.duration }}
  renewBefore: {{ .Values.servingTLS.certManager.renewBefore }}
  dnsNames:
    {{- include "provider-gateway.names" . | fromJsonArray | toYaml | nindent 4 }}
  usages:
    - server auth
    - digital signature
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    {{- if $issuerRef }}
    {{- toYaml $issuerRef | nindent 4 }}
    {{- else }}
    group: cert-manager.io
    kind: Issuer
    name: {{ $name }}-ca
    {{- end }}
{{- end }}
