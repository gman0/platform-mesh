{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "provider-gateway.name" . }}
  labels:
    {{- include "provider-gateway.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "provider-gateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      {{- with .Values.metrics.serviceMonitor.interval }}
      interval: {{ . }}
      {{- end }}
{{- end }}
{{- if .Values.metrics.prometheusRule.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "provider-gateway.name" . }}
  labels:
    {{- include "provider-gateway.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: provider-gateway
      rules:
        # A Server Key rotation is about to strand Connections: within a day of a key's
        # retireAt (or past it), Connections seen in the last day still don't list a
        # key that isn't retiring. List them with their lastSeen and follow the
        # rotation runbook.
        - alert: ProviderGatewayServerKeyRotationIncomplete
          expr: |
            (
              sum by (namespace, key) (providersdk_server_key_connections{listed="false"}) > 0
              unless on (namespace, key) providersdk_server_key_retire_at_seconds
            )
            and on (namespace)
            (
              count by (namespace) (providersdk_server_key_retire_at_seconds - time() < 86400) > 0
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Connections don't list the new Server Key yet
            description: '{{ "{{ $value }}" }} Connection(s) seen in the last day don''t list ServerKey {{ "{{ $labels.key }}" }}, and another key is retired within a day.'
{{- end }}
